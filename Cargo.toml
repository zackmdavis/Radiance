[features]
default = []
blas = ["ndarray/blas"]

[package]
name = "radiance"
version = "0.0.3"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
approx = "0.5"
chrono = "*"
env_logger = "*"
lazy_static = "*"
log = "*"
ndarray = {version = "0.16", features = ["approx"]} 
ndarray-rand = "0.15"
ndarray-npy = "0.9.1"
num-traits = "*"
rand = "*"
rand_distr = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
topological-sort = "*"

[profile.release]
debug = true
